[pytest]
# Pytest configuration for EcoLoop backend

# Enable asyncio support for async test functions
asyncio_mode = auto

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Markers
markers =
    async: marks tests as async (deselect with '-m "not async"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
